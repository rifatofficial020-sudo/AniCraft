
name: AniCraft Windows x64 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build AniCraft
        run: cargo build --release --locked --target x86_64-pc-windows-msvc -p anicraft -p anicraft-cli

      - name: Prepare release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $Output = "target/x86_64-pc-windows-msvc/release"
          $Package = "AniCraft-Windows-x64"

          New-Item -ItemType Directory -Force -Path "dist/$Package"

          Copy-Item "$Output/anicraft.exe" "dist/$Package/"
          Copy-Item "$Output/anicraft-cli.exe" "dist/$Package/"

          Copy-Item "README.md" "dist/$Package/"
          Copy-Item "LICENSE-MIT" "dist/$Package/"
          Copy-Item "LICENSE-APACHE" "dist/$Package/"

          Compress-Archive `
            -Path "dist/$Package/*" `
            -DestinationPath "dist/AniCraft-Windows-x64.zip" `
            -Force

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: AniCraft-Windows-x64
          path: dist/AniCraft-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
